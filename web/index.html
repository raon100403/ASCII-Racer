<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>ASCII Racer · WASM</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap');
    @import url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css');

    :root {
      color-scheme: dark;
      font-family: 'VT323', 'Galmuri9', 'Courier New', monospace;
      --phosphor: #16f7ff;
      --phosphor-dim: #42bfc9;
      --phosphor-faint: #0b4c58;
      --neon-purple: #9d4eff;
      --neon-yellow: #ffe66d;
      --neon-green: #42ff76;
      --neon-orange: #ff8a3d;
      --terminal-black: #000;
    }
    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; overflow-x: hidden; background: var(--terminal-black); color: var(--phosphor); }
    main { width: min(1180px, 100%); padding: clamp(14px, 3vw, 30px); }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 12px; padding-bottom: 8px; }
    h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 2.4rem); font-weight: 400; letter-spacing: .08em; color: var(--neon-purple); text-shadow: 0 0 8px #b77cff88; }
    .tag { color: var(--neon-yellow); font: 400 1rem/1 'VT323', 'Galmuri9', 'Courier New', monospace; letter-spacing: .14em; text-shadow: 0 0 7px #ffe66d66; }
    .game-shell { position: relative; overflow: hidden; border: 1px solid var(--phosphor-dim); background: var(--terminal-black); box-shadow: 0 0 18px #42ff7622, inset 0 0 0 1px var(--phosphor-faint); }
    canvas { display: block; width: 100%; height: min(70vh, 680px); outline: none; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: #000e; color: var(--phosphor); text-align: center; font: 400 1.25rem/1.2 'VT323', 'Galmuri9', 'Courier New', monospace; text-shadow: 0 0 8px #16f7ff88; }
    #status[hidden] { display: none; }
    .start-menu { display: grid; gap: 12px; width: min(280px, 100%); }
    .start-menu p { margin: 0 0 8px; color: var(--phosphor-dim); }
    .start-button { min-height: 58px; font-size: 1.35rem; }
    .controls { display: flex; justify-content: space-between; gap: 18px; margin-top: 14px; user-select: none; }
    .pad, .actions { display: grid; gap: 8px; }
    .pad { grid-template-columns: repeat(3, 54px); grid-template-areas: ". up ." "left down right"; }
    .actions { grid-template-columns: repeat(2, minmax(72px, 108px)); align-content: end; }
    button { min-height: 50px; border: 1px solid var(--phosphor-dim); border-radius: 0; background: #031408; color: var(--phosphor); font: 400 1.1rem/1 'VT323', 'Galmuri9', 'Courier New', monospace; touch-action: none; cursor: pointer; box-shadow: inset 0 0 0 1px #16f7ff22, 0 0 10px #16f7ff22; }
    button:active, button.active { background: var(--phosphor-faint); border-color: var(--phosphor); color: #d7ffff; transform: translateY(1px); }
    #reset { border-color: var(--neon-yellow); color: var(--neon-yellow); }
    [data-key="drift"] { border-color: var(--neon-purple); color: var(--neon-purple); }
    [data-key="up"] { grid-area: up; } [data-key="left"] { grid-area: left; }
    [data-key="down"] { grid-area: down; } [data-key="right"] { grid-area: right; }
    .joystick { display: none; }
    .hint { margin: 12px 2px 0; color: var(--phosphor-dim); font-size: 1rem; line-height: 1.2; text-align: center; }
    .latin, .start-menu, .controls button { font-family: 'VT323', 'Courier New', monospace; font-size: 1.4em; line-height: 0.8; }
    .hint-item { white-space: nowrap; }
    .hint-item .latin { text-shadow: 0 0 7px currentColor; }
    .hint-accelerate { color: var(--neon-green); }
    .hint-brake { color: var(--neon-orange); }
    .hint-steer { color: var(--phosphor); }
    .hint-drift { color: var(--neon-purple); }
    .hint-reset { color: var(--neon-yellow); }
    .game-shell::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, transparent 0, transparent 2px, #42ff7608 3px, transparent 4px); mix-blend-mode: screen; }
    @media (pointer: fine) and (min-width: 760px) { .controls { display: none; } }
    @media (pointer: coarse) {
      body.mobile { display: block; overflow: hidden; }
      body.mobile main { display: grid; grid-template-rows: minmax(0, 1fr) max(190px, 29dvh); width: 100%; height: 100dvh; padding: 0; }
      body.mobile header, body.mobile .hint { display: none; }
      body.mobile .game-shell { min-height: 0; border-width: 0 0 1px; }
      body.mobile canvas { height: 100%; }
      body.mobile .controls { min-height: 0; margin: 0; padding: 12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); align-items: center; background: #020807; }
      body.mobile .actions { grid-template-columns: repeat(2, minmax(74px, 1fr)); width: min(43vw, 230px); }
      body.mobile .actions button { min-height: 64px; }
      body.mobile .pad { display: none; }
      body.mobile .joystick { display: grid; place-items: center; width: min(42vw, 180px); aspect-ratio: 1; border: 0; background: radial-gradient(closest-side, transparent calc(100% - 3px), var(--phosphor-dim) 0); clip-path: polygon(38% 0, 62% 0, 62% 6%, 75% 6%, 75% 12%, 88% 12%, 88% 25%, 94% 25%, 94% 38%, 100% 38%, 100% 62%, 94% 62%, 94% 75%, 88% 75%, 88% 88%, 75% 88%, 75% 94%, 62% 94%, 62% 100%, 38% 100%, 38% 94%, 25% 94%, 25% 88%, 12% 88%, 12% 75%, 6% 75%, 6% 62%, 0 62%, 0 38%, 6% 38%, 6% 25%, 12% 25%, 12% 12%, 25% 12%, 25% 6%, 38% 6%); touch-action: none; }
      body.mobile .joystick-knob { width: 38%; aspect-ratio: 1; background: radial-gradient(closest-side, transparent calc(100% - 3px), var(--phosphor) 0); clip-path: polygon(38% 0, 62% 0, 62% 12%, 75% 12%, 75% 25%, 88% 25%, 88% 38%, 100% 38%, 100% 62%, 88% 62%, 88% 75%, 75% 75%, 75% 88%, 62% 88%, 62% 100%, 38% 100%, 38% 88%, 25% 88%, 25% 75%, 12% 75%, 12% 62%, 0 62%, 0 38%, 12% 38%, 12% 25%, 25% 25%, 25% 12%, 38% 12%); }
      body.mobile.mobile-auto .joystick { display: none; }
      body.mobile.mobile-auto .pad { display: grid; }
      body.mobile.mobile-auto.mobile-auto-running [data-key="up"] { visibility: hidden; pointer-events: none; }
      body.mobile:not(.mobile-playing) main { display: block; }
      body.mobile:not(.mobile-playing) .game-shell { height: 100dvh; border: 0; }
      body.mobile:not(.mobile-playing) canvas { visibility: hidden; }
      body.mobile:not(.mobile-playing) .controls { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header><h1>ASCII RACER</h1><div class="tag">3 LAPS</div></header>
    <section class="game-shell">
      <canvas id="game" tabindex="0" aria-label="ASCII 레이싱 게임"></canvas>
      <div id="status"><span><span class="latin">WASM</span> 엔진을 불러오는 중…</span></div>
    </section>
    <div class="controls" aria-label="터치 조작">
      <div class="joystick" aria-label="조이스틱"><div class="joystick-knob"></div></div>
      <div class="pad">
        <button data-key="up" aria-label="가속">▲</button><button data-key="left" aria-label="왼쪽">◀</button>
        <button data-key="down" aria-label="브레이크">▼</button><button data-key="right" aria-label="오른쪽">▶</button>
      </div>
      <div class="actions"><button data-key="drift">DRIFT</button><button id="reset">RESET</button></div>
    </div>
    <p class="hint"><span class="hint-item hint-accelerate"><span class="latin">W</span> / ↑ 가속</span> · <span class="hint-item hint-brake"><span class="latin">S</span> / ↓ 브레이크</span> · <span class="hint-item hint-steer"><span class="latin">A D</span> / ← → 조향</span> · <span class="hint-item hint-drift"><span class="latin">Space</span> 드리프트</span> · <span class="hint-item hint-reset"><span class="latin">R</span> 리셋</span></p>
  </main>
  <script type="module">
    const canvas = document.querySelector('#game');
    const status = document.querySelector('#status');
    const ctx = canvas.getContext('2d', { alpha: false });
    const keyBits = { up: 1, down: 2, left: 4, right: 8, drift: 16 };
    const codeToKey = {
      KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down',
      KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right', Space: 'drift'
    };
    const isMobile = matchMedia('(pointer: coarse)').matches;
    let wasm, memory, input = 0, heldInput = 0, columns = 0, rows = 0, last = performance.now();
    let cellWidth = 8, cellHeight = 16, dpr = 1, autoAccelerating = false;
    if (isMobile) document.body.classList.add('mobile');

    function resize() {
      const rect = canvas.getBoundingClientRect();
      dpr = Math.min(devicePixelRatio || 1, 2);
      cellHeight = rect.width < 620 ? 12 : 16;
      cellWidth = cellHeight / 2;
      const nextColumns = Math.max(48, Math.min(144, Math.floor(rect.width / cellWidth)));
      const nextRows = Math.max(22, Math.min(52, Math.floor(rect.height / cellHeight)));
      cellWidth = rect.width / (nextColumns + 2);
      cellHeight = rect.height / (nextRows + 2);
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      columns = nextColumns; rows = nextRows;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.textBaseline = 'top';
      ctx.font = `700 ${Math.floor(cellHeight)}px 'JetBrains Mono', monospace`;
      if (wasm) wasm.game_resize(columns, rows);
    }

    function applyInput() {
      input = heldInput | (autoAccelerating && !(heldInput & keyBits.down) ? keyBits.up : 0);
      if (wasm) wasm.game_set_input(input);
      Object.entries(keyBits).forEach(([name, bit]) => {
        document.querySelectorAll(`[data-key="${name}"]`).forEach(el => el.classList.toggle('active', Boolean(input & bit)));
      });
    }

    function setKey(name, pressed) {
      const bit = keyBits[name];
      heldInput = pressed ? heldInput | bit : heldInput & ~bit;
      applyInput();
    }

    function startMobile(mode) {
      document.body.classList.add('mobile-playing', `mobile-${mode}`);
      autoAccelerating = false;
      status.hidden = true;
      requestAnimationFrame(resize);
      document.documentElement.requestFullscreen?.().catch(() => {});
      wasm?.game_reset();
    }

    function showStartMenu() {
      status.innerHTML = `<div class="start-menu"><p>CONTROL MODE</p><button class="start-button" data-mode="joystick">START · JOYSTICK</button><button class="start-button" data-mode="auto">START · AUTO ACCEL</button></div>`;
      status.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => startMobile(button.dataset.mode)));
    }

    function moveJoystick(event) {
      const joystick = event.currentTarget;
      const rect = joystick.getBoundingClientRect();
      const x = (event.clientX - rect.left - rect.width / 2) / (rect.width / 2);
      const y = (event.clientY - rect.top - rect.height / 2) / (rect.height / 2);
      const distance = Math.min(1, Math.hypot(x, y));
      const knob = joystick.querySelector('.joystick-knob');
      knob.style.transform = `translate(${x / Math.max(1, Math.hypot(x, y)) * distance * 70}%, ${y / Math.max(1, Math.hypot(x, y)) * distance * 70}%)`;
      setKey('left', x < -.22); setKey('right', x > .22);
      setKey('up', y < -.22); setKey('down', y > .22);
    }

    function releaseJoystick() {
      document.querySelector('.joystick-knob').style.transform = '';
      ['up', 'down', 'left', 'right'].forEach(key => setKey(key, false));
    }

    addEventListener('keydown', event => {
      if (event.code === 'KeyR') { wasm?.game_reset(); event.preventDefault(); return; }
      const key = codeToKey[event.code];
      if (key) { setKey(key, true); event.preventDefault(); }
    });
    addEventListener('keyup', event => {
      const key = codeToKey[event.code];
      if (key) { setKey(key, false); event.preventDefault(); }
    });
    addEventListener('blur', () => { heldInput = 0; applyInput(); });
    document.querySelectorAll('[data-key]').forEach(button => {
      const key = button.dataset.key;
      button.addEventListener('pointerdown', event => {
        if (isMobile && document.body.classList.contains('mobile-auto') && key === 'up' && !autoAccelerating) {
          autoAccelerating = true;
          document.body.classList.add('mobile-auto-running');
          applyInput();
          return;
        }
        button.setPointerCapture(event.pointerId);
        setKey(key, true);
      });
      button.addEventListener('pointerup', () => setKey(key, false));
      button.addEventListener('pointercancel', () => setKey(key, false));
    });
    const joystick = document.querySelector('.joystick');
    joystick.addEventListener('pointerdown', event => { joystick.setPointerCapture(event.pointerId); moveJoystick(event); });
    joystick.addEventListener('pointermove', event => { if (joystick.hasPointerCapture(event.pointerId)) moveJoystick(event); });
    joystick.addEventListener('pointerup', releaseJoystick);
    joystick.addEventListener('pointercancel', releaseJoystick);
    document.querySelector('#reset').addEventListener('click', () => {
      if (isMobile && document.body.classList.contains('mobile-auto')) {
        autoAccelerating = false;
        heldInput = 0;
        document.body.classList.remove('mobile-auto-running');
        applyInput();
      }
      wasm?.game_reset();
    });
    new ResizeObserver(resize).observe(canvas);

    function draw() {
      const length = wasm.game_frame_len();
      const ptr = wasm.game_frame_ptr();
      const cells = new Uint32Array(memory.buffer, ptr, length);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      ctx.save();
      ctx.globalAlpha = .92;
      for (let y = 0; y < rows; y++) {
        let run = '', runColor = -1, runStart = 0;
        const flush = x => {
          if (run && run.trim()) {
            const r = runColor & 255, g = (runColor >>> 8) & 255, b = (runColor >>> 16) & 255;
            ctx.fillStyle = `rgb(${r} ${g} ${b})`;
            ctx.fillText(run, (runStart + 1) * cellWidth, (y + 1) * cellHeight, (x - runStart) * cellWidth);
          }
        };
        for (let x = 0; x < columns; x++) {
          const packed = cells[y * columns + x] || 32;
          const color = packed >>> 8;
          if (color !== runColor) { flush(x); run = ''; runStart = x; runColor = color; }
          run += String.fromCharCode(packed & 255);
        }
        flush(columns);
      }
      ctx.restore();
    }

    function frame(now) {
      wasm.game_tick(Math.min((now - last) / 1000, 0.05));
      last = now; draw(); requestAnimationFrame(frame);
    }

    try {
      await document.fonts.ready;
      resize();
      const response = await fetch('./ascii_racer.wasm');
      if (!response.ok) throw new Error(`WASM 요청 실패 (${response.status})`);
      const result = await WebAssembly.instantiateStreaming(response, {});
      wasm = result.instance.exports;
      memory = wasm.memory;
      wasm.game_init(columns, rows);
      wasm.game_set_glyph_mode(new URLSearchParams(location.search).get('glyph-mode') === 'density' ? 1 : 0);
      wasm.game_tick(0);
      if (isMobile) showStartMenu();
      else status.hidden = true;
      if (!isMobile) canvas.focus();
      requestAnimationFrame(frame);
    } catch (error) {
      console.error(error);
      status.textContent = `게임을 시작하지 못했습니다: ${error.message}\n로컬 웹 서버에서 web/index.html을 열어 주세요.`;
      status.style.whiteSpace = 'pre-line';
    }
  </script>
</body>
</html>
