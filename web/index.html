<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>ASCII Racer · WASM</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    @import url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css');

    :root {
      color-scheme: dark;
      font-family: 'VT323', 'Galmuri9', 'Courier New', monospace;
      --phosphor: #16f7ff;
      --phosphor-dim: #42bfc9;
      --phosphor-faint: #0b4c58;
      --neon-purple: #9d4eff;
      --neon-yellow: #ffe66d;
      --neon-green: #42ff76;
      --neon-orange: #ff8a3d;
      --terminal-black: #000;
    }
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; overflow-x: hidden;
      background: var(--terminal-black);
      color: var(--phosphor);
    }
    main { width: min(1180px, 100%); padding: clamp(14px, 3vw, 30px); }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 12px; padding-bottom: 8px; }
    h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 2.4rem); font-weight: 400; letter-spacing: .08em; color: var(--neon-purple); text-shadow: 0 0 8px #b77cff88; }
    .tag { color: var(--neon-yellow); font: 400 1rem/1 'VT323', 'Galmuri9', 'Courier New', monospace; letter-spacing: .14em; text-shadow: 0 0 7px #ffe66d66; }
    .game-shell {
      position: relative; overflow: hidden; border: 1px solid var(--phosphor-dim);
      background: var(--terminal-black); box-shadow: 0 0 18px #42ff7622, inset 0 0 0 1px var(--phosphor-faint);
    }
    canvas {
      display: block; width: 100%; height: min(70vh, 680px); outline: none;
    }
    #status {
      position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
      background: #000e; color: var(--phosphor); text-align: center; font: 400 1.25rem/1.2 'VT323', 'Galmuri9', 'Courier New', monospace;
      text-shadow: 0 0 8px #16f7ff88;
    }
    #status[hidden] { display: none; }
    .controls { display: flex; justify-content: space-between; gap: 18px; margin-top: 14px; user-select: none; }
    .pad, .actions { display: grid; gap: 8px; }
    .pad { grid-template-columns: repeat(3, 54px); grid-template-areas: ". up ." "left down right"; }
    .actions { grid-template-columns: repeat(2, minmax(72px, 108px)); align-content: end; }
    button {
      min-height: 50px; border: 1px solid var(--phosphor-dim); border-radius: 0; background: #031408;
      color: var(--phosphor); font: 400 1.1rem/1 'VT323', 'Galmuri9', 'Courier New', monospace; touch-action: none; cursor: pointer;
      box-shadow: inset 0 0 0 1px #16f7ff22, 0 0 10px #16f7ff22;
    }
    button:active, button.active { background: var(--phosphor-faint); border-color: var(--phosphor); color: #d7ffff; transform: translateY(1px); }
    #reset { border-color: var(--neon-yellow); color: var(--neon-yellow); }
    [data-key="drift"] { border-color: var(--neon-purple); color: var(--neon-purple); }
    [data-key="up"] { grid-area: up; } [data-key="left"] { grid-area: left; }
    [data-key="down"] { grid-area: down; } [data-key="right"] { grid-area: right; }
    .hint { margin: 12px 2px 0; color: var(--phosphor-dim); font-size: 1rem; line-height: 1.2; text-align: center; }
    .latin { font-family: 'VT323', 'Courier New', monospace; font-size: 1.4em; line-height: 0.8; }
    .hint-item { white-space: nowrap; }
    .hint-item .latin { text-shadow: 0 0 7px currentColor; }
    .hint-accelerate { color: var(--neon-green); }
    .hint-brake { color: var(--neon-orange); }
    .hint-steer { color: var(--phosphor); }
    .hint-drift { color: var(--neon-purple); }
    .hint-reset { color: var(--neon-yellow); }
    .game-shell::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(to bottom, transparent 0, transparent 2px, #42ff7608 3px, transparent 4px);
      mix-blend-mode: screen;
    }
    @media (pointer: fine) and (min-width: 760px) { .controls { display: none; } }
  </style>
</head>
<body>
  <main>
    <header><h1>ASCII RACER</h1><div class="tag">3 LAPS</div></header>
    <section class="game-shell">
      <canvas id="game" tabindex="0" aria-label="ASCII 레이싱 게임"></canvas>
      <div id="status"><span><span class="latin">WASM</span> 엔진을 불러오는 중…</span></div>
    </section>
    <div class="controls" aria-label="터치 조작">
      <div class="pad">
        <button data-key="up" aria-label="가속">▲</button><button data-key="left" aria-label="왼쪽">◀</button>
        <button data-key="down" aria-label="브레이크">▼</button><button data-key="right" aria-label="오른쪽">▶</button>
      </div>
      <div class="actions"><button data-key="drift">DRIFT</button><button id="reset">RESET</button></div>
    </div>
    <p class="hint"><span class="hint-item hint-accelerate"><span class="latin">W</span> / ↑ 가속</span> · <span class="hint-item hint-brake"><span class="latin">S</span> / ↓ 브레이크</span> · <span class="hint-item hint-steer"><span class="latin">A D</span> / ← → 조향</span> · <span class="hint-item hint-drift"><span class="latin">Space</span> 드리프트</span> · <span class="hint-item hint-reset"><span class="latin">R</span> 리셋</span></p>
  </main>
  <script type="module">
    const canvas = document.querySelector('#game');
    const status = document.querySelector('#status');
    const ctx = canvas.getContext('2d', { alpha: false });
    const keyBits = { up: 1, down: 2, left: 4, right: 8, drift: 16 };
    const codeToKey = {
      KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down',
      KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right', Space: 'drift'
    };
    let wasm, memory, input = 0, columns = 0, rows = 0, last = performance.now();
    let cellWidth = 8, cellHeight = 16, dpr = 1;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      dpr = Math.min(devicePixelRatio || 1, 2);
      cellHeight = rect.width < 620 ? 12 : 16;
      cellWidth = cellHeight / 2;
      const nextColumns = Math.max(48, Math.min(144, Math.floor(rect.width / cellWidth)));
      const nextRows = Math.max(22, Math.min(52, Math.floor(rect.height / cellHeight)));
      cellWidth = rect.width / (nextColumns + 2);
      cellHeight = rect.height / (nextRows + 2);
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      columns = nextColumns; rows = nextRows;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.textBaseline = 'top';
      ctx.font = `600 ${Math.floor(cellHeight)}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
      if (wasm) wasm.game_resize(columns, rows);
    }

    function setKey(name, pressed) {
      const bit = keyBits[name];
      input = pressed ? input | bit : input & ~bit;
      if (wasm) wasm.game_set_input(input);
      document.querySelectorAll(`[data-key="${name}"]`).forEach(el => el.classList.toggle('active', pressed));
    }

    addEventListener('keydown', event => {
      if (event.code === 'KeyR') { wasm?.game_reset(); event.preventDefault(); return; }
      const key = codeToKey[event.code];
      if (key) { setKey(key, true); event.preventDefault(); }
    });
    addEventListener('keyup', event => {
      const key = codeToKey[event.code];
      if (key) { setKey(key, false); event.preventDefault(); }
    });
    addEventListener('blur', () => { input = 0; wasm?.game_set_input(0); });
    document.querySelectorAll('[data-key]').forEach(button => {
      const key = button.dataset.key;
      button.addEventListener('pointerdown', event => { button.setPointerCapture(event.pointerId); setKey(key, true); });
      button.addEventListener('pointerup', () => setKey(key, false));
      button.addEventListener('pointercancel', () => setKey(key, false));
    });
    document.querySelector('#reset').addEventListener('click', () => wasm?.game_reset());
    new ResizeObserver(resize).observe(canvas);

    function draw() {
      const length = wasm.game_frame_len();
      const ptr = wasm.game_frame_ptr();
      const cells = new Uint32Array(memory.buffer, ptr, length);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      ctx.save();
      ctx.globalAlpha = .92;
      for (let y = 0; y < rows; y++) {
        let run = '', runColor = -1, runStart = 0;
        const flush = x => {
          if (run && run.trim()) {
            const r = runColor & 255, g = (runColor >>> 8) & 255, b = (runColor >>> 16) & 255;
            ctx.fillStyle = `rgb(${r} ${g} ${b})`;
            ctx.fillText(run, (runStart + 1) * cellWidth, (y + 1) * cellHeight, (x - runStart) * cellWidth);
          }
        };
        for (let x = 0; x < columns; x++) {
          const packed = cells[y * columns + x] || 32;
          const color = packed >>> 8;
          if (color !== runColor) { flush(x); run = ''; runStart = x; runColor = color; }
          run += String.fromCharCode(packed & 255);
        }
        flush(columns);
      }
      ctx.restore();
    }

    function frame(now) {
      wasm.game_tick(Math.min((now - last) / 1000, 0.05));
      last = now; draw(); requestAnimationFrame(frame);
    }

    try {
      resize();
      const response = await fetch('./ascii_racer.wasm');
      if (!response.ok) throw new Error(`WASM 요청 실패 (${response.status})`);
      const result = await WebAssembly.instantiateStreaming(response, {});
      wasm = result.instance.exports;
      memory = wasm.memory;
      wasm.game_init(columns, rows);
      wasm.game_tick(0);
      status.hidden = true;
      canvas.focus();
      requestAnimationFrame(frame);
    } catch (error) {
      console.error(error);
      status.textContent = `게임을 시작하지 못했습니다: ${error.message}\n로컬 웹 서버에서 web/index.html을 열어 주세요.`;
      status.style.whiteSpace = 'pre-line';
    }
  </script>
</body>
</html>
