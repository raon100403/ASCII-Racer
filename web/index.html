<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110b">
  <title>ASCII Racer · WASM</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; overflow-x: hidden;
      background: radial-gradient(circle at 50% -20%, #243a2c 0, #0b1710 38%, #050805 80%);
      color: #eef7eb;
    }
    main { width: min(1180px, 100%); padding: clamp(14px, 3vw, 30px); }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: clamp(1.25rem, 3vw, 2rem); letter-spacing: .06em; }
    .tag { color: #91d6a0; font: 700 .72rem/1 ui-monospace, monospace; letter-spacing: .14em; }
    .game-shell {
      position: relative; overflow: hidden; border: 1px solid #35513b; border-radius: 14px;
      background: #000; box-shadow: 0 24px 80px #000b, inset 0 0 0 1px #ffffff0a;
    }
    canvas {
      display: block; width: 100%; height: min(70vh, 680px); outline: none;
      filter: contrast(.94) saturate(1.08);
    }
    #status {
      position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
      background: #050805e8; color: #b9d5bd; text-align: center; font: 700 .9rem ui-monospace, monospace;
    }
    #status[hidden] { display: none; }
    .controls { display: flex; justify-content: space-between; gap: 18px; margin-top: 14px; user-select: none; }
    .pad, .actions { display: grid; gap: 8px; }
    .pad { grid-template-columns: repeat(3, 54px); grid-template-areas: ". up ." "left down right"; }
    .actions { grid-template-columns: repeat(2, minmax(72px, 108px)); align-content: end; }
    button {
      min-height: 50px; border: 1px solid #45634c; border-radius: 11px; background: #142219;
      color: #eaf6e8; font: 800 .78rem ui-monospace, monospace; touch-action: none; cursor: pointer;
      box-shadow: inset 0 1px #ffffff12, 0 4px 12px #0005;
    }
    button:active, button.active { background: #31553a; border-color: #73bd82; transform: translateY(1px); }
    [data-key="up"] { grid-area: up; } [data-key="left"] { grid-area: left; }
    [data-key="down"] { grid-area: down; } [data-key="right"] { grid-area: right; }
    .hint { margin: 12px 2px 0; color: #829388; font-size: .78rem; text-align: center; }
    @media (pointer: fine) and (min-width: 760px) { .controls { display: none; } }
  </style>
</head>
<body>
  <main>
    <header><div><div class="tag">RUST · WEBASSEMBLY</div><h1>ASCII RACER</h1></div><div class="tag">3 LAPS</div></header>
    <section class="game-shell">
      <canvas id="game" tabindex="0" aria-label="ASCII 레이싱 게임"></canvas>
      <div id="status">WASM 엔진을 불러오는 중…</div>
    </section>
    <div class="controls" aria-label="터치 조작">
      <div class="pad">
        <button data-key="up" aria-label="가속">▲</button><button data-key="left" aria-label="왼쪽">◀</button>
        <button data-key="down" aria-label="브레이크">▼</button><button data-key="right" aria-label="오른쪽">▶</button>
      </div>
      <div class="actions"><button data-key="drift">DRIFT</button><button id="reset">RESET</button></div>
    </div>
    <p class="hint">W / ↑ 가속 · S / ↓ 브레이크 · A D / ← → 조향 · Space 드리프트 · R 리셋</p>
  </main>
  <script type="module">
    const canvas = document.querySelector('#game');
    const status = document.querySelector('#status');
    const ctx = canvas.getContext('2d', { alpha: false });
    const keyBits = { up: 1, down: 2, left: 4, right: 8, drift: 16 };
    const codeToKey = {
      KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down',
      KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right', Space: 'drift'
    };
    let wasm, memory, input = 0, columns = 0, rows = 0, last = performance.now();
    let cellWidth = 8, cellHeight = 16, dpr = 1;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      dpr = Math.min(devicePixelRatio || 1, 2);
      cellHeight = rect.width < 620 ? 12 : 16;
      cellWidth = cellHeight / 2;
      const nextColumns = Math.max(48, Math.min(144, Math.floor(rect.width / cellWidth)));
      const nextRows = Math.max(22, Math.min(52, Math.floor(rect.height / cellHeight)));
      cellWidth = rect.width / nextColumns;
      cellHeight = rect.height / nextRows;
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      columns = nextColumns; rows = nextRows;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.textBaseline = 'top';
      ctx.font = `600 ${Math.floor(cellHeight)}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
      if (wasm) wasm.game_resize(columns, rows);
    }

    function setKey(name, pressed) {
      const bit = keyBits[name];
      input = pressed ? input | bit : input & ~bit;
      if (wasm) wasm.game_set_input(input);
      document.querySelectorAll(`[data-key="${name}"]`).forEach(el => el.classList.toggle('active', pressed));
    }

    addEventListener('keydown', event => {
      if (event.code === 'KeyR') { wasm?.game_reset(); event.preventDefault(); return; }
      const key = codeToKey[event.code];
      if (key) { setKey(key, true); event.preventDefault(); }
    });
    addEventListener('keyup', event => {
      const key = codeToKey[event.code];
      if (key) { setKey(key, false); event.preventDefault(); }
    });
    addEventListener('blur', () => { input = 0; wasm?.game_set_input(0); });
    document.querySelectorAll('[data-key]').forEach(button => {
      const key = button.dataset.key;
      button.addEventListener('pointerdown', event => { button.setPointerCapture(event.pointerId); setKey(key, true); });
      button.addEventListener('pointerup', () => setKey(key, false));
      button.addEventListener('pointercancel', () => setKey(key, false));
    });
    document.querySelector('#reset').addEventListener('click', () => wasm?.game_reset());
    new ResizeObserver(resize).observe(canvas);

    function draw() {
      const length = wasm.game_frame_len();
      const ptr = wasm.game_frame_ptr();
      const cells = new Uint32Array(memory.buffer, ptr, length);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      // A faint, softly blurred color layer joins neighboring ASCII cells into
      // readable surfaces while keeping the characters themselves crisp.
      const surfaces = new Map();
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < columns; x++) {
          const packed = cells[y * columns + x] || 32;
          if ((packed & 255) === 32) continue;
          const color = packed >>> 8;
          let path = surfaces.get(color);
          if (!path) { path = new Path2D(); surfaces.set(color, path); }
          path.rect(x * cellWidth + .5, y * cellHeight + 1, cellWidth - 1, cellHeight - 2);
        }
      }
      ctx.save();
      ctx.globalAlpha = .18;
      ctx.shadowBlur = Math.max(2, cellHeight * .22);
      for (const [color, path] of surfaces) {
        const r = color & 255, g = (color >>> 8) & 255, b = (color >>> 16) & 255;
        ctx.fillStyle = ctx.shadowColor = `rgb(${r} ${g} ${b})`;
        ctx.fill(path);
      }
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = .92;
      for (let y = 0; y < rows; y++) {
        let run = '', runColor = -1, runStart = 0;
        const flush = x => {
          if (run && run.trim()) {
            const r = runColor & 255, g = (runColor >>> 8) & 255, b = (runColor >>> 16) & 255;
            ctx.fillStyle = `rgb(${r} ${g} ${b})`;
            ctx.fillText(run, runStart * cellWidth, y * cellHeight, (x - runStart) * cellWidth);
          }
        };
        for (let x = 0; x < columns; x++) {
          const packed = cells[y * columns + x] || 32;
          const color = packed >>> 8;
          if (color !== runColor) { flush(x); run = ''; runStart = x; runColor = color; }
          run += String.fromCharCode(packed & 255);
        }
        flush(columns);
      }
      ctx.restore();
    }

    function frame(now) {
      wasm.game_tick(Math.min((now - last) / 1000, 0.05));
      last = now; draw(); requestAnimationFrame(frame);
    }

    try {
      resize();
      const response = await fetch('./ascii_racer.wasm');
      if (!response.ok) throw new Error(`WASM 요청 실패 (${response.status})`);
      const result = await WebAssembly.instantiateStreaming(response, {});
      wasm = result.instance.exports;
      memory = wasm.memory;
      wasm.game_init(columns, rows);
      wasm.game_tick(0);
      status.hidden = true;
      canvas.focus();
      requestAnimationFrame(frame);
    } catch (error) {
      console.error(error);
      status.textContent = `게임을 시작하지 못했습니다: ${error.message}\n로컬 웹 서버에서 web/index.html을 열어 주세요.`;
      status.style.whiteSpace = 'pre-line';
    }
  </script>
</body>
</html>
